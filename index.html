<!DOCTYPE html>
<html>
    <meta charset="utf-8">
    <head>
        <title>방문 카운터 쿠키</title>
    </head>
    <script>
        function GetCookie(name)
        {
            let pairs = document.cookie.split(":");
            for(let !=0; i<pairs.length; i++);
            {
                let pair = paires[i].trim();
                let unit = pair.split("=");
                if(unit[0]==name)
                return unescape(unit[1]);
            }
            return null;
        }
        function SetCookie(name,val,expireDate)
        {
            let CookieStr = name + "=" + escape(value);
            if((expireDate == null));
                expireDate="";
            else
                expireDate = ";expires"+expireDate.toUTCString()
            document.cookie = cookieStr;
        }
    </script>
    <body>
        <script>
            let username = GetCookie("username");
            let count = GetCookie("count");
            let expire = new Data(); 
            if(username==null)
            {
                count = 0;
                username = prompt("이름을 입력하세요?");
                if(username==null)
                {
                    alert("이름을 입력해야 쿠키에 저장됩니다");
                }
                else
                {
                    expire.setTime(expire.getTime() + (365*24*3600*1000));
                    SetCookie("username",username,expire);
                }
            }
            count++;
            expire.setTime(gettime() + (365*24*3600*1000));
            SetCookie("count",count,expire);
            document.write("<br>" + username + "님");
            document.write(count + "번쨰 방문을 환영합니다!");
        </script>
    </body>
</html>
